server:
  port: 8080

spring:
  application:
    name: xxl-job-demo
  output:
    ansi:
      enabled: always

logging:
  pattern:
    console: '%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx'
  level:
    com.zijinshe: DEBUG
    com.xxl.job: INFO

xxl:
  job:
    admin:
      addresses: http://localhost:8090
    accessToken: default_token
    executor:
      appname: ${spring.application.name}
      port: 9999
      # ip 不配置时自动探测本机网卡 IP（容器内即容器 IP，与 Admin 同网络时可直接回调）
      # 需要指定时用 Spring Boot 标准环境变量 XXL_JOB_EXECUTOR_IP 覆盖即可
